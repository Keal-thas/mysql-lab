site_name: mysql-lab
site_description: 从真实场景出发学 MySQL 的动手实验室
docs_dir: docs
exclude_docs: |
  .git/
  .idea/
  .claude/
  docs-starlight/
  *.sh
  Dockerfile
  docker-compose.yml
  mkdocs.yml
  *.sql

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-night
        name: 切换到浅色
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到深色
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite


# 不写 nav：MkDocs 会按 docs_dir 的目录结构自动生成完整导航，新增/删除文件
# 不用来这里维护。唯一手动干预的地方是让 DASHBOARD.md 排在最前面当首页。
nav:
  - 仪表盘: DASHBOARD.md
