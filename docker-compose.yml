services:
  mysql:
    image: mysql:8.4
    container_name: mysql-lab
    environment:
      MYSQL_ROOT_PASSWORD: "root"
    # server-id + log-bin: 常开 binlog，配合 mysqlbinlog 命令行练手（二进制，网页看不了）。
    # slow-query-log + log-output=TABLE: 慢查询直接写进 mysql.slow_log 表，用 Adminer 网页查。
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --slow-query-log=1
      --long-query-time=1
      --log-output=TABLE
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-lab-data:/var/lib/mysql

  # 网页版 SQL 客户端：http://127.0.0.1:13380，System 选 MySQL，
  # Server 填 mysql，用户 root，密码 root。
  adminer:
    image: adminer:latest
    container_name: mysql-lab-adminer
    depends_on:
      - mysql
    ports:
      - "127.0.0.1:13380:8080"

  # 网页看所有容器的实时日志：http://127.0.0.1:13381，
  # 不用 docker logs / docker exec 进容器看。
  dozzle:
    image: amir20/dozzle:latest
    container_name: mysql-lab-dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:13381:8080"

  # 网页看仓库里的 md 文档（README/ROADMAP/PITFALLS/各 demo 说明）：
  # http://127.0.0.1:13382，MkDocs Material 官方镜像，配置见 mkdocs.yml。
  docs:
    image: squidfunk/mkdocs-material:latest
    container_name: mysql-lab-docs
    volumes:
      - ./:/docs:ro
      - ./mkdocs.yml:/mkdocs.yml:ro
    command: ["serve", "-f", "/mkdocs.yml", "-a", "0.0.0.0:8000"]
    ports:
      - "127.0.0.1:13382:8000"

  # 纯粹用来对比效果：Starlight (Astro) 版的同一批文档，http://127.0.0.1:13383。
  # 没有官方现成镜像，用 node 跑一个最小 Astro+Starlight 项目，sync-docs.mjs
  # 把仓库的 md 同步进去并补上 Starlight 要求的 title frontmatter。
  docs-starlight:
    image: node:20-alpine
    container_name: mysql-lab-docs-starlight
    working_dir: /app
    volumes:
      - ./:/repo:ro
      - ./docs-starlight:/app
    command: sh -c "npm install --no-fund --no-audit && node sync-docs.mjs && npm run dev -- --host 0.0.0.0 --port 4321"
    ports:
      - "127.0.0.1:13383:4321"

  # --- Oracle->PostgreSQL PoC（临时，重资源，用 profile 隔离，不随 `docker compose up` 默认启动）---
  # 这台 Docker daemon 被多个 agent/worktree 共用，container_name 是 daemon 全局唯一的，
  # 不能硬编码（不同 worktree 跑同名服务会互相冲突/报错）。故意不设 container_name，
  # 交给 compose 用项目前缀（默认取自目录名）自动生成，不同 worktree 天然不会撞名。
  #
  # 起法：docker compose --profile oracle-poc up -d
  # 看端口映射：docker compose --profile oracle-poc port oracle 1521 / port pg-poc 5432
  # 关法：只关这两个服务，不要对整个文件跑 down（会牵动没有 profile 的其它服务）：
  #   docker compose --profile oracle-poc rm -sf oracle pg-poc
  #   docker volume rm $(docker volume ls -q | grep -E '(oracle|pg)-poc-data')
  oracle:
    image: gvenzl/oracle-free:23-slim
    profiles: ["oracle-poc"]
    environment:
      ORACLE_PASSWORD: "oracle"
      APP_USER: "demo"
      APP_USER_PASSWORD: "demo"
    ports:
      - "127.0.0.1:13521:1521"
    volumes:
      - oracle-poc-data:/opt/oracle/oradata

  pg-poc:
    image: postgres:16
    profiles: ["oracle-poc"]
    environment:
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "demo"
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pg-poc-data:/var/lib/postgresql/data

volumes:
  mysql-lab-data:
  oracle-poc-data:
  pg-poc-data:
